spring.application.name=restaurant-ordering-system

# ===============================
# DATABASE CONFIGURATION
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/restaurant_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ===============================
# JPA CONFIGURATION
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:true}

# ===============================
# SERVER
# ===============================
server.port=${PORT:8081}

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET:change-this-local-secret-to-a-long-random-value}

# ===============================
# CORS
# ===============================
app.cors.allowed-origins=http://localhost:5173